<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="QA / Test Engineer role illustration">
  <defs>
    <linearGradient id="qa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="qa-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="qa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#qa-grad)" stroke="#a7f3d0" stroke-width="1.5"/>

  <!-- Testing Clipboard -->
  <g filter="url(#qa-shadow)">
    <!-- Clipboard Board -->
    <rect x="25" y="24" width="50" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Clipboard Clip -->
    <rect x="38" y="20" width="24" height="8" rx="2.5" fill="#334155"/>
    <circle cx="50" cy="24" r="2" fill="#e2e8f0"/>

    <!-- Checklist Item 1 (Passed) -->
    <circle cx="34" cy="38" r="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <path d="M32 38 L33.5 39.5 L36.5 36.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="37" width="26" height="2.5" rx="1" fill="#334155"/>

    <!-- Checklist Item 2 (Passed) -->
    <circle cx="34" cy="48" r="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <path d="M32 48 L33.5 49.5 L36.5 46.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="47" width="22" height="2.5" rx="1" fill="#334155"/>

    <!-- Checklist Item 3 (Regression Test in Progress / Passed) -->
    <circle cx="34" cy="58" r="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <path d="M32 58 L33.5 59.5 L36.5 56.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="57" width="24" height="2.5" rx="1" fill="#334155"/>

    <!-- Validation Score Bar: 100% PASS -->
    <rect x="30" y="66" width="40" height="7" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="35" y="71.5" font-family="'Outfit', sans-serif" font-size="5.5" font-weight="800" fill="#047857">&#10003; 100% AUTOMATED</text>
  </g>

  <!-- Bug Test Badge Overlay (Bottom Right) -->
  <g transform="translate(62, 56)" filter="url(#qa-shadow)">
    <circle cx="13" cy="13" r="12" fill="#059669" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Shield / Seal Checkmark -->
    <path d="M9 13.5 L12 16.5 L17.5 10.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
