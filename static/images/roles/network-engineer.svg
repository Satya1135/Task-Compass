<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="Network Engineer role illustration">
  <defs>
    <linearGradient id="net-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="net-switch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="net-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#net-grad)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- Network Routing Topology Connections -->
  <g stroke="#0d9488" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="32" x2="30" y2="48"/>
    <line x1="50" y1="32" x2="70" y2="48"/>
    <line x1="30" y1="48" x2="50" y2="66"/>
    <line x1="70" y1="48" x2="50" y2="66"/>
    <line x1="30" y1="48" x2="70" y2="48" stroke-dasharray="2 2"/>
  </g>

  <!-- Central Cloud/Router Node (Top) -->
  <g transform="translate(50, 32)" filter="url(#net-shadow)">
    <circle cx="0" cy="0" r="11" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
    <!-- Router Cross Arrows -->
    <path d="M-4 0 H4 M0 -4 V4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="-2 -4 0 -6 2 -4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-2 4 0 6 2 4" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left Client/Server Node -->
  <g transform="translate(30, 48)" filter="url(#net-shadow)">
    <circle cx="0" cy="0" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <rect x="-4" y="-4" width="8" height="6" rx="1" fill="#ffffff"/>
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Right Client/Server Node -->
  <g transform="translate(70, 48)" filter="url(#net-shadow)">
    <circle cx="0" cy="0" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <rect x="-4" y="-4" width="8" height="6" rx="1" fill="#ffffff"/>
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Bottom Core Switch / Firewall Rack -->
  <g transform="translate(24, 64)" filter="url(#net-shadow)">
    <rect x="0" y="0" width="52" height="15" rx="3.5" fill="url(#net-switch)" stroke="#334155" stroke-width="1.2"/>
    <!-- Port Array & Activity LEDs -->
    <circle cx="8" cy="7.5" r="1.5" fill="#10b981"/>
    <circle cx="14" cy="7.5" r="1.5" fill="#10b981"/>
    <circle cx="20" cy="7.5" r="1.5" fill="#0ea5e9"/>
    <circle cx="26" cy="7.5" r="1.5" fill="#0d9488"/>
    <circle cx="32" cy="7.5" r="1.5" fill="#f59e0b"/>
    <circle cx="38" cy="7.5" r="1.5" fill="#10b981"/>
    <rect x="43" y="5" width="5" height="5" rx="1" fill="#475569"/>
  </g>

  <!-- High-Speed Packet Data Badges -->
  <circle cx="40" cy="40" r="2.5" fill="#2dd4bf"/>
  <circle cx="60" cy="40" r="2.5" fill="#38bdf8"/>
</svg>
