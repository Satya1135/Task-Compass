<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="UX / UI Designer role illustration">
  <defs>
    <linearGradient id="ux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ux-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="ux-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#ux-grad)" stroke="#ddd6fe" stroke-width="1.5"/>

  <!-- Back UI Screen (Mobile Wireframe) -->
  <g filter="url(#ux-shadow)" transform="rotate(-6 36 48)">
    <rect x="22" y="24" width="30" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="26" y="29" width="22" height="6" rx="2" fill="#e0e7ff"/>
    <rect x="26" y="38" width="10" height="12" rx="2" fill="#f1f5f9"/>
    <rect x="38" y="38" width="10" height="12" rx="2" fill="#f1f5f9"/>
    <rect x="26" y="53" width="22" height="12" rx="2" fill="#f5f3ff" stroke="#c4b5fd" stroke-dasharray="2 1.5"/>
  </g>

  <!-- Front UI Screen (Desktop Dashboard Wireframe) -->
  <g filter="url(#ux-shadow)">
    <rect x="36" y="28" width="46" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- App Header -->
    <rect x="36" y="28" width="46" height="10" rx="6" fill="url(#ux-accent)"/>
    <circle cx="41" cy="33" r="1.5" fill="#fde047"/>
    <circle cx="45" cy="33" r="1.5" fill="#6ee7b7"/>
    <!-- Wireframe Layout Elements -->
    <rect x="40" y="42" width="16" height="13" rx="2.5" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="48" cy="48.5" r="3" fill="#7c3aed"/>
    <rect x="60" y="42" width="18" height="3" rx="1.5" fill="#0f172a"/>
    <rect x="60" y="47" width="14" height="2" rx="1" fill="#94a3b8"/>
    <rect x="60" y="51" width="10" height="2" rx="1" fill="#cbd5e1"/>
    <!-- CTA Button -->
    <rect x="40" y="59" width="38" height="9" rx="3" fill="#0d9488"/>
    <rect x="51" y="62.5" width="16" height="2" rx="1" fill="#ffffff"/>
  </g>

  <!-- Vector Pen Tool Overlay (Bottom Left) -->
  <g transform="translate(18, 54)" filter="url(#ux-shadow)">
    <circle cx="12" cy="12" r="12" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- Pen Tool Nib -->
    <path d="M12 6 L16 11 L13 17 L11 17 L8 11 Z" fill="#ffffff"/>
    <polygon points="12,6 14,10 10,10" fill="#7c3aed"/>
    <line x1="12" y1="10" x2="12" y2="15" stroke="#0f172a" stroke-width="1"/>
    <circle cx="12" cy="15" r="0.8" fill="#0f172a"/>
  </g>
</svg>
