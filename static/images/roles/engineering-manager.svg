<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="Engineering Manager role illustration">
  <defs>
    <linearGradient id="em-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="em-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="em-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#em-grad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Leadership / Team Hierarchy Chart Base -->
  <!-- Connecting Hierarchy Branches -->
  <path d="M50 38 V48 H32 V56 M50 48 H68 V56" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

  <!-- Engineering Manager Avatar (Top Center Leadership) -->
  <g transform="translate(50, 28)" filter="url(#em-shadow)">
    <!-- Head -->
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
    <!-- Tie / Collar -->
    <path d="M-3 4 L0 9 L3 4 Z" fill="#2dd4bf"/>
    <!-- Star / Leadership Crown Pin -->
    <polygon points="0,-4 1.5,-1 4,-1 2,1 3,4 0,2 -3,4 -2,1 -4,-1 -1.5,-1" fill="#f59e0b"/>
  </g>

  <!-- Team Member 1 (Left Engineer) -->
  <g transform="translate(32, 64)" filter="url(#em-shadow)">
    <circle cx="0" cy="0" r="8" fill="#0d9488" stroke="#ffffff" stroke-width="1.8"/>
    <text x="-4" y="3" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="800" fill="#ffffff">FE</text>
  </g>

  <!-- Team Member 2 (Center Engineer) -->
  <g transform="translate(50, 64)" filter="url(#em-shadow)">
    <circle cx="0" cy="0" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <text x="-4" y="3" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="800" fill="#ffffff">BE</text>
  </g>

  <!-- Team Member 3 (Right Security / Ops) -->
  <g transform="translate(68, 64)" filter="url(#em-shadow)">
    <circle cx="0" cy="0" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="1.8"/>
    <text x="-5" y="3" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="800" fill="#ffffff">SEC</text>
  </g>

  <!-- Sprint Delivery Progress Pill (Bottom) -->
  <g transform="translate(24, 78)" filter="url(#em-shadow)">
    <rect x="0" y="0" width="52" height="12" rx="6" fill="#ffffff" stroke="#99f6e4" stroke-width="1.2"/>
    <!-- Progress Bar -->
    <rect x="3" y="3" width="36" height="6" rx="3" fill="#0d9488"/>
    <rect x="39" y="3" width="10" height="6" rx="3" fill="#ccfbf1"/>
    <circle cx="39" cy="6" r="2" fill="#ffffff"/>
  </g>
</svg>
