<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="Security Analyst role illustration">
  <defs>
    <linearGradient id="sa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sa-doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="sa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#sa-grad)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- GRC Compliance / Audit Assessment Document -->
  <g filter="url(#sa-shadow)">
    <!-- Document Page -->
    <rect x="24" y="22" width="46" height="58" rx="5" fill="url(#sa-doc)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Document Header / Security Audit Banner -->
    <rect x="24" y="22" width="46" height="10" rx="5" fill="#0d9488"/>
    <circle cx="29" cy="27" r="1.5" fill="#fde047"/>
    <rect x="34" y="25.5" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>

    <!-- Audit Lines & Checklist -->
    <circle cx="31" cy="38" r="2.5" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <path d="M29.8 38 L30.6 38.8 L32.2 37.2" stroke="#059669" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="37" y="37" width="26" height="2" rx="1" fill="#334155"/>

    <circle cx="31" cy="46" r="2.5" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <path d="M29.8 46 L30.6 46.8 L32.2 45.2" stroke="#059669" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="37" y="45" width="22" height="2" rx="1" fill="#334155"/>

    <circle cx="31" cy="54" r="2.5" fill="#eff6ff" stroke="#0284c7" stroke-width="1"/>
    <path d="M29.8 54 L30.6 54.8 L32.2 53.2" stroke="#0284c7" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="37" y="53" width="24" height="2" rx="1" fill="#334155"/>

    <!-- Risk Matrix Score -->
    <rect x="28" y="62" width="38" height="12" rx="3" fill="#f0fdfa" stroke="#99f6e4" stroke-width="0.8"/>
    <text x="31" y="70" font-family="'Outfit', sans-serif" font-size="5.5" font-weight="700" fill="#0f766e">RISK RATING: LOW</text>
  </g>

  <!-- Threat Investigation Magnifying Glass (Right Overlay) -->
  <g transform="translate(48, 44)" filter="url(#sa-shadow)">
    <!-- Lens Rim -->
    <circle cx="20" cy="20" r="14" fill="#f0fdfa" stroke="#0f172a" stroke-width="3" fill-opacity="0.85"/>
    <circle cx="20" cy="20" r="11" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 1.5"/>
    <!-- Target Crosshairs inside Lens -->
    <line x1="20" y1="12" x2="20" y2="28" stroke="#0d9488" stroke-width="1"/>
    <line x1="12" y1="20" x2="28" y2="20" stroke="#0d9488" stroke-width="1"/>
    <circle cx="20" cy="20" r="3" fill="#0d9488"/>
    <!-- Handle -->
    <line x1="30" y1="30" x2="42" y2="42" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="31" y1="31" x2="41" y2="41" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
