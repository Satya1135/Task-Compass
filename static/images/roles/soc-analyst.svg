<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="SOC Analyst role illustration">
  <defs>
    <linearGradient id="soc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="soc-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="soc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#soc-grad)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- SOC Monitoring Workstation Main Display -->
  <g filter="url(#soc-shadow)">
    <!-- Main Screen Bezel -->
    <rect x="20" y="24" width="60" height="42" rx="5" fill="#334155" stroke="#475569" stroke-width="1.2"/>
    <!-- Screen Glass -->
    <rect x="23" y="27" width="54" height="36" rx="3" fill="url(#soc-screen)"/>
    
    <!-- SIEM Radar / Threat Telemetry Circle (Left Half) -->
    <circle cx="38" cy="45" r="13" stroke="#0d9488" stroke-width="1" stroke-dasharray="2 1.5"/>
    <circle cx="38" cy="45" r="8" stroke="#0d9488" stroke-width="0.8" opacity="0.6"/>
    <circle cx="38" cy="45" r="3" fill="#2dd4bf"/>
    <!-- Radar Sweep Line -->
    <line x1="38" y1="45" x2="48" y2="37" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Detected Event Dot -->
    <circle cx="44" cy="40" r="1.5" fill="#38bdf8"/>
    <circle cx="32" cy="49" r="1.2" fill="#2dd4bf"/>

    <!-- Incident Triage Feed & Logs (Right Half) -->
    <!-- Alert Row 1 -->
    <rect x="54" y="32" width="20" height="4" rx="1" fill="#0d9488"/>
    <circle cx="56.5" cy="34" r="1" fill="#ffffff"/>
    <rect x="59" y="33" width="13" height="2" rx="0.5" fill="#ffffff" opacity="0.9"/>

    <!-- Alert Row 2 -->
    <rect x="54" y="38" width="20" height="4" rx="1" fill="#0284c7"/>
    <circle cx="56.5" cy="40" r="1" fill="#ffffff"/>
    <rect x="59" y="39" width="11" height="2" rx="0.5" fill="#ffffff" opacity="0.9"/>

    <!-- Alert Row 3 -->
    <rect x="54" y="44" width="20" height="4" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.6"/>
    <rect x="56" y="45.5" width="16" height="1.5" rx="0.5" fill="#94a3b8"/>

    <!-- Metrics Line Chart at Bottom of Screen -->
    <polyline points="26,59 34,55 42,57 52,52 62,55 72,49" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stand & Base -->
    <rect x="47" y="66" width="6" height="6" fill="#475569"/>
    <rect x="38" y="72" width="24" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- 24/7 SIEM Pulse Indicator Badge Overlay (Top Right) -->
  <g transform="translate(66, 16)" filter="url(#soc-shadow)">
    <rect x="0" y="0" width="24" height="14" rx="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/>
    <text x="4" y="10" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="800" fill="#ffffff">24/7</text>
  </g>
</svg>
