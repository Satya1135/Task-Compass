<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="Product Manager role illustration">
  <defs>
    <linearGradient id="pm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="pm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="pm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#pm-grad)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- Planning Board / Roadmap Base -->
  <g filter="url(#pm-shadow)">
    <rect x="22" y="24" width="56" height="48" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="22" y="24" width="56" height="12" rx="7" fill="url(#pm-accent)"/>
    <!-- Header decorative dots -->
    <circle cx="28" cy="30" r="1.5" fill="#fde047"/>
    <circle cx="33" cy="30" r="1.5" fill="#6ee7b7"/>
    <rect x="40" y="28.5" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Roadmap Columns / Kanban Cards -->
  <!-- Column 1: Backlog -->
  <rect x="26" y="40" width="13" height="9" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
  <rect x="28" y="43" width="9" height="1.5" rx="0.75" fill="#64748b"/>
  <rect x="26" y="52" width="13" height="14" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
  <rect x="28" y="55" width="9" height="1.5" rx="0.75" fill="#64748b"/>
  <rect x="28" y="58" width="6" height="1.5" rx="0.75" fill="#94a3b8"/>

  <!-- Column 2: In Progress / Milestone -->
  <rect x="43" y="40" width="14" height="18" rx="2" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <rect x="45.5" y="44" width="9" height="2" rx="1" fill="#0d9488"/>
  <rect x="45.5" y="48" width="7" height="1.5" rx="0.75" fill="#14b8a6"/>
  <circle cx="53" cy="53" r="2.5" fill="#0d9488"/>
  <path d="M51.8 53 L52.6 53.8 L54.2 52.2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Column 3: Shipped / Done -->
  <rect x="61" y="40" width="13" height="11" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <path d="M64 45.5 L66.5 48 L71 43.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="61" y="54" width="13" height="12" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
  <path d="M64 59.5 L66.5 62 L71 57.5" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Strategy Compass Badge Overlay (Bottom Right) -->
  <g transform="translate(62, 58)" filter="url(#pm-shadow)">
    <circle cx="13" cy="13" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="13" cy="13" r="9" fill="#1e293b"/>
    <!-- Compass Pointer -->
    <polygon points="13,6 16,13 13,11 10,13" fill="#2dd4bf"/>
    <polygon points="13,20 16,13 13,15 10,13" fill="#38bdf8"/>
    <circle cx="13" cy="13" r="1.5" fill="#ffffff"/>
  </g>
</svg>
