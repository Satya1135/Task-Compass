<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" aria-label="Customer Support / IT role illustration">
  <defs>
    <linearGradient id="it-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="headset-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="it-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#it-grad)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- Support Desk Terminal Display -->
  <g filter="url(#it-shadow)">
    <!-- Terminal Bezel -->
    <rect x="24" y="24" width="52" height="38" rx="5" fill="#334155" stroke="#475569" stroke-width="1.2"/>
    <!-- Terminal Screen -->
    <rect x="27" y="27" width="46" height="32" rx="3" fill="#ffffff"/>
    
    <!-- Support Ticket Top Bar -->
    <rect x="27" y="27" width="46" height="8" rx="2" fill="#0d9488"/>
    <text x="31" y="33" font-family="'Outfit', sans-serif" font-size="5" font-weight="700" fill="#ffffff">IT DESK &bull; TICKET #104</text>
    
    <!-- Dialogue Bubble 1 (User Issue) -->
    <rect x="30" y="38" width="22" height="7" rx="2" fill="#f1f5f9"/>
    <rect x="33" y="40.5" width="16" height="2" rx="1" fill="#64748b"/>

    <!-- Dialogue Bubble 2 (IT Resolution) -->
    <rect x="48" y="47" width="22" height="8" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8"/>
    <path d="M51 51 L53 53 L57 49" stroke="#059669" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="59" y="50" width="8" height="2" rx="1" fill="#047857"/>

    <!-- Stand -->
    <rect x="47" y="62" width="6" height="5" fill="#475569"/>
    <rect x="38" y="67" width="24" height="3" rx="1.5" fill="#64748b"/>
  </g>

  <!-- Modern Communication Headset Overlay -->
  <g transform="translate(18, 20)" filter="url(#it-shadow)">
    <!-- Headband Arc -->
    <path d="M12 28 C12 14 36 14 36 28" stroke="#0f172a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="9" y="26" width="6" height="12" rx="3" fill="#0d9488"/>
    <!-- Right Ear Cup -->
    <rect x="33" y="26" width="6" height="12" rx="3" fill="#0d9488"/>
    <!-- Microphone Boom Arm -->
    <path d="M12 36 Q16 46 25 44" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Mic Tip -->
    <circle cx="26" cy="44" r="2.5" fill="#2dd4bf"/>
  </g>

  <!-- IT Tool Gear / Checkmark Badge Overlay (Bottom Right) -->
  <g transform="translate(62, 56)" filter="url(#it-shadow)">
    <circle cx="13" cy="13" r="12" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <!-- Diagnostic Wrench / Screwdriver Icon -->
    <path d="M9 17 L14 12 M13 11 C13 9 15 8 17 8 C18 9 18 10 17 11 L16 11 L16 13 L17 13 C18 14 17 16 15 16 C14 16 13 15 13 14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="16" r="1" fill="#2dd4bf"/>
  </g>
</svg>
